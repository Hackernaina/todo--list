<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>


    <style>

        /* =========================
           PAGE
        ========================== */

        body {
            font-family: Arial, sans-serif;

            background-color: #f2f2f2;

            display: flex;
            justify-content: center;

            padding-top: 80px;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            background-color: white;

            width: 400px;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }


        /* =========================
           HEADING
        ========================== */

        h1 {
            color: #333;

            text-align: center;

            margin-bottom: 25px;
        }


        /* =========================
           INPUT
        ========================== */

        #taskInput {
            width: 68%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 14px;
        }


        /* =========================
           ADD BUTTON
        ========================== */

        #addButton {
            padding: 10px 15px;

            border: none;

            border-radius: 5px;

            background-color: #333;

            color: white;

            cursor: pointer;
        }

        #addButton:hover {
            background-color: #555;
        }


        /* =========================
           TASK LIST
        ========================== */

        #taskList {
            margin-top: 25px;

            padding: 0;

            list-style: none;
        }


        /* =========================
           EACH TASK
        ========================== */

        #taskList li {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px;

            margin-bottom: 10px;

            background-color: #f5f5f5;

            border-radius: 8px;

            cursor: pointer;
        }


        /* =========================
           DELETE BUTTON
        ========================== */

        #taskList button {
            background-color: #ff4d4d;

            color: white;

            border: none;

            padding: 6px 10px;

            border-radius: 5px;

            cursor: pointer;
        }

        #taskList button:hover {
            background-color: #e60000;
        }


        /* =========================
           COMPLETED TASK
        ========================== */

        .completed {
            text-decoration: line-through;

            color: #999;

            background-color: #e8e8e8 !important;
        }

    </style>

</head>


<body>


    <!-- =========================
         HTML
    ========================== -->

    <div class="container">

        <h1>My To-Do List</h1>


        <!-- Input -->

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >


        <!-- Add button -->

        <button id="addButton">
            Add
        </button>


        <!-- Tasks will appear here -->

        <ul id="taskList"></ul>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        // =========================
        // GET HTML ELEMENTS
        // =========================

        const taskInput =
            document.getElementById("taskInput");

        const addButton =
            document.getElementById("addButton");

        const taskList =
            document.getElementById("taskList");



        // =========================
        // ADD BUTTON EVENT
        // =========================

        addButton.addEventListener(
            "click",
            addTask
        );



        // =========================
        // ENTER KEY EVENT
        // =========================

        taskInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    addTask();

                }

            }
        );



        // =========================
        // ADD TASK FUNCTION
        // =========================

        function addTask() {


            // Get the text
            // entered by the user

            const taskText =
                taskInput.value.trim();



            // Don't allow empty tasks

            if (taskText === "") {

                return;

            }



            // Create a new list item

            const li =
                document.createElement("li");



            // Add task text

            li.textContent =
                taskText;



            // =========================
            // COMPLETE TASK
            // =========================

            li.addEventListener(
                "click",
                function() {

                    li.classList.toggle(
                        "completed"
                    );

                }
            );



            // =========================
            // DELETE BUTTON
            // =========================

            const deleteButton =
                document.createElement("button");


            deleteButton.textContent =
                "Delete";



            // Delete task when button
            // is clicked

            deleteButton.addEventListener(
                "click",
                function(event) {


                    // Prevent the click
                    // from reaching the <li>

                    event.stopPropagation();


                    // Remove the task

                    li.remove();

                }
            );



            // Put delete button
            // inside the list item

            li.appendChild(
                deleteButton
            );



            // Put the list item
            // inside the task list

            taskList.appendChild(
                li
            );



            // Clear the input

            taskInput.value = "";



            // Put cursor back
            // inside input

            taskInput.focus();

        }


    </script>


</body>

</html>
